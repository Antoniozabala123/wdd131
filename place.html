<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album | Antonio Zabala</title>
    <meta name="description" content="WDD 131 - Dynamic Web Fundamentals - Antonio Zabala">
    <meta name="author" content="Antonio Zabala">
    <script src="scripts/temples.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">

<link rel="stylesheet" href="styles/place.css">
<link rel="stylesheet" href="styles/temples-large.css">
</head>
<body>
    <header><h1>Japan</h1></header>
<main>
    <div class="hero-section">
    <picture class="hero">
        <source srcset="images/hero-large.webp" media="(min-width: 1000px)">
        <source srcset="images/hero-medium.webp" media="(min-width: 550px)">
        <img src="images/hero-small.webp" alt="Tokyo Tower - Japan">
    </picture>
    <section class="data-card">
        <div class="card-title">
            <h2>Data</h2>
        </div>
    <div class="row">
        <div class="col">Area:</div>
        <div class="col">377,975 sq km</div>
    </div>
    <div class="row">
        <div class="col">Population:</div>
        <div class="col">123,800,000</div>
    </div>
    <div class="row">
        <div class="col">Capital:</div>
        <div class="col">Tokyo</div>
    </div>
    <div class="row">
        <div class="col">Languages:</div>
        <div class="col">Japanese</div>
    </div>
    <div class="row">
        <div class="col">Currency:</div>
        <div class="col">Japanese Yen</div>
    </div>
    <div class="row">
        <div class="col">Time Zone:</div>
        <div class="col">UTC+9</div>
    </div>
    <div class="row">
        <div class="col">Calling Code:</div>
        <div class="col">+81</div>
    </div>
    <div class="row">
        <div class="col">Internet TLD:</div>
        <div class="col">.jp</div>
    </div>
</section>
<section class="card-weather">
    <div class="card-title">
        <h2>Weather</h2>
    </div>
    <div class="card-body">
        <div class="mobile-weather-icon">
            <img src="images/sunny.png" alt="weather icon" class="weather-icon">
        </div>
        <div class="row">
            <div class="col">Temperature:</div>
            <div class="col">15 °C</div>
        </div>
        <div class="row">
            <div class="col">Conditions:</div>
            <div class="col">Sunny</div>
        </div>
        <div class="row">
            <div class="col">Wind:</div>
            <div class="col">12 km/h</div>
        </div>
        <div class="row">
            <div class="col">Wind Chill:</div>
            <div class="col">14 °C</div>
        </div>
    </div>
    </section>
</main>
<footer>
    <p>&copy; <span id="currentYear"></span> Antonio Zabala - Caracas</p>
    <p>Last Modification: <span id="lastModified"></span></p>
</footer>
    
</body>
</html>
